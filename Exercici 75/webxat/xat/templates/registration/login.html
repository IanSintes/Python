<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Inici de Sessió</title>
</head>
<body>
    <h1>Inicia sessió</h1>

    {% if form.errors %}
        <p style="color:red;">Nom d'usuari o contrasenya incorrectes.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
